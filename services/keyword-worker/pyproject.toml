[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puisiapp-keyword-worker"
version = "0.1.0"
description = "Worker ekstraksi kata kunci puisi berbasis stemming Sastrawi dan TF-IDF (K6)"
requires-python = ">=3.11"
dependencies = [
    "pymongo==4.8.0",
    "pika>=1.3.2",
    "PySastrawi>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jsonschema>=4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
