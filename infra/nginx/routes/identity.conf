# Rute domain Akun dan identitas (kelompok 1). Header X-User-Id dan X-User-Role
# selalu ditentukan gateway; nilai dari klien ditimpa (tidak bisa dipalsukan).

# Registrasi: publik
location = /api/auth/register {
    proxy_pass http://$up_register$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
}

# Login: publik, dibatasi 10 per menit per IP
location = /api/auth/login {
    limit_req zone=login_ip burst=9 nodelay;
    proxy_pass http://$up_login$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
}

# Refresh: publik, memakai cookie refresh token (diverifikasi token-service)
location = /api/auth/refresh {
    proxy_pass http://$up_login$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
}

# Verifikasi email dan reset kata sandi: publik
location = /api/auth/verify-email {
    proxy_pass http://$up_recovery$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
}
location ~ ^/api/auth/(forgot-password|reset-password)$ {
    proxy_pass http://$up_recovery$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
}

# Logout: wajib login
location = /api/auth/logout {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    proxy_pass http://$up_login$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header X-User-Id   $user_id;
    proxy_set_header X-User-Role $user_role;
}

# Profil saya: wajib login (GET dan PUT)
location = /api/profiles/me {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    proxy_pass http://$up_profile$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header X-User-Id   $user_id;
    proxy_set_header X-User-Role $user_role;
}

# Profil orang lain: publik, hanya GET
location ~ ^/api/profiles/[^/]+$ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://$up_profile$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
}

# Hapus akun: wajib login
location = /api/me {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    proxy_pass http://$up_profile$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header X-User-Id   $user_id;
    proxy_set_header X-User-Role $user_role;
}
