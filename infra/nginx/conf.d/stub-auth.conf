# STUB untuk pengembangan sebelum token-service asli (T1.2) berjalan.
# Tanpa cookie access_token -> 401. Dengan cookie apa pun -> 200 dengan identitas palsu.
# Jangan dipakai di deploy.
server {
    listen 127.0.0.1:8099;
    location = /internal/auth/verify {
        if ($cookie_access_token = "") {
            return 401;
        }
        add_header X-User-Id   "stub-user" always;
        add_header X-User-Role "writer"    always;
        return 200 "stub\n";
    }
}
