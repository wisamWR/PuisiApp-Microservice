# Server utama. Satu-satunya server yang dipetakan ke host.
server {
    listen 80;
    server_name _;

    include /etc/nginx/vars.conf;

    # Identitas default kosong. Hanya auth_request_set di rute terlindungi yang mengisinya,
    # sehingga header X-User-Id dan X-User-Role dari klien tidak pernah sampai ke layanan.
    set $user_id   "";
    set $user_role "";

    # Dipanggil dari auth_request. Tidak bisa diakses dari luar.
    location = /_auth {
        internal;
        proxy_pass http://$up_auth/internal/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Request-Id $request_id;
        proxy_cache auth_cache;
        proxy_cache_key $cookie_access_token;
        proxy_cache_valid 200 30s;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized"}';
    }

    # Rute per domain: identity, lalu domain lain ditambahkan kelompok masing-masing.
    include /etc/nginx/routes/*.conf;

    location / {
        proxy_pass http://$up_frontend$request_uri;
        include /etc/nginx/common/proxy-headers.conf;
    }
}
