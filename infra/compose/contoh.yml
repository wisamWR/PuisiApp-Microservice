# Layanan contoh (T0.2). Hanya berjalan bila profil "contoh" diaktifkan:
#   docker compose --profile contoh up -d --build
# Tidak ikut di EC2.

services:
  example-consumer:
    profiles: [contoh]
    build:
      context: ..
      dockerfile: services/example-consumer/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: example-consumer
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PREFETCH: "10"
      DATABASE_URL: postgres://example:${EXAMPLE_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/example_db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
