proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Request-Id $request_id;
# Identitas selalu ditentukan gateway, nilai dari klien tidak pernah diteruskan.
# Default kosong (lihat conf.d/gateway.conf), sehingga header tidak dikirim di rute publik.
# Rute yang butuh login mengisinya lewat auth_request_set $user_id dan $user_role.
proxy_set_header X-User-Id   $user_id;
proxy_set_header X-User-Role $user_role;
