# Bookmark puisi dan tautan bagikan (T3.4, kelompok 3).
# X-User-Id dan X-User-Role diatur common/proxy-headers.conf dari auth_request; jangan set ulang.

# Daftar simpanan pengguna: wajib login.
location = /api/me/bookmarks {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    error_page 500 502 503 504 = @auth_unavailable;
    limit_except GET HEAD { deny all; }
    proxy_pass http://$up_bookmark$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

# Status, simpan, dan batal simpan satu puisi: wajib login.
location ~ "^/api/me/bookmarks/[0-9a-f-]{36}$" {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    error_page 500 502 503 504 = @auth_unavailable;
    limit_except GET HEAD PUT DELETE { deny all; }
    client_max_body_size 1k;
    proxy_pass http://$up_bookmark$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

# Tautan bagikan: publik, dibaca crawler media sosial (tanpa JavaScript).
# Membalas HTML meta Open Graph lalu mengalihkan browser ke /poems/{id} di SPA.
location ~ "^/p/[0-9a-f-]{36}$" {
    limit_except GET HEAD { deny all; }
    limit_req zone=pratinjau_ip burst=20 nodelay;
    proxy_pass http://$up_bookmark$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}
