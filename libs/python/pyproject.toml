[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puisi-event-lib"
version = "0.1.0"
description = "Pustaka event-driven Python untuk PuisiApp Microservice"
requires-python = ">=3.11"
dependencies = [
    "pika==1.3.2",
    "psycopg2-binary==2.9.9",
    "jsonschema==4.23.0",
    "prometheus-client==0.20.0",
]

[tool.setuptools.packages.find]
include = ["event_lib*"]

[tool.ruff]
line-length = 120
target-version = "py311"
