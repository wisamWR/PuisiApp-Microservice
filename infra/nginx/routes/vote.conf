# Rute domain Suara dan peringkat (kelompok 9).
# X-User-Id dan X-User-Role diatur common/proxy-headers.conf dari auth_request; jangan set ulang.

# GET -> skor tampil + suara saya, PUT -> beri/ubah/tarik suara (body {"nilai": 1|-1|0}).
# Rate limit 30 suara per menit per pengguna (zona auth_user berbasis cookie token),
# ditegakkan ulang di vote-service memakai Redis.
location ~ "^/api/poems/[0-9a-f-]{36}/vote$" {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    error_page 500 502 503 504 = @auth_unavailable;
    limit_except GET HEAD PUT { deny all; }
    limit_req zone=auth_user burst=10 nodelay;
    client_max_body_size 1k;
    proxy_pass http://$up_vote$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header traceparent $http_traceparent;
}
