# Rute domain Penulisan puisi (kelompok 2).
# Semua konten puisi butuh login (laporan Tabel 3.1).
# X-User-Id dan X-User-Role diatur common/proxy-headers.conf dari auth_request; jangan set ulang.

# POST -> poem-create (ajukan puisi, 202). GET -> poem-query (daftar puisi, T2.3).
location = /api/poems {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    limit_except GET HEAD POST { deny all; }
    # Puisi adalah teks pendek: isi maksimal 8.000 karakter (laporan 11.4).
    client_max_body_size 64k;
    proxy_pass http://$up_poems_koleksi$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    # Diteruskan ke layanan: traceparent untuk tracing, Idempotency-Key ikut otomatis.
    proxy_set_header traceparent $http_traceparent;
}

# Satu puisi: GET -> poem-query (T2.3), PUT -> poem-edit, DELETE -> poem-delete (T2.4).
# Rute yang lebih panjang (mis. /api/poems/{id}/vote milik kelompok 9) tidak cocok
# dengan pola ini karena diakhiri $.
# Regex dikutip karena mengandung {} (tanpa kutip nginx membacanya sebagai blok).
location ~ "^/api/poems/[0-9a-f-]{36}$" {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    limit_except GET HEAD PUT DELETE { deny all; }
    client_max_body_size 64k;
    proxy_pass http://$up_poems_satu$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header traceparent $http_traceparent;
}

# Pratinjau gambar kutipan (T2.5): publik seperti Listing A.6 laporan. Hasil
# hanya bergantung pada query string, sehingga di-cache CloudFront 24 jam
# (Cache-Control dari layanan) dan browser memakai ETag/304.
location = /api/images/preview {
    limit_except GET HEAD { deny all; }
    limit_req zone=pratinjau_ip burst=20 nodelay;
    proxy_pass http://$up_image_preview$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

location = /api/images/templates {
    limit_except GET HEAD { deny all; }
    proxy_pass http://$up_image_preview$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

# Status pemrosesan langsung (T2.7): Server-Sent Events, hanya pemilik puisi
# (dicek status-stream-service dari X-User-Id). Respons tidak boleh di-buffer
# dan koneksi dibiarkan terbuka lama; ": ping" dari layanan tiap 15 dtk
# menjaga koneksi tetap hidup. Lebih dari satu replika didukung (Redis pub/sub),
# dan resolver Docker membagi koneksi ke replika yang ada.
location ~ "^/api/poems/[0-9a-f-]{36}/status/stream$" {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    limit_except GET { deny all; }
    proxy_pass http://$up_status_stream$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
