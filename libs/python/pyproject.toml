[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puisi-event-lib"
version = "0.1.0"
description = "Pustaka event bersama RabbitMQ untuk worker Python Puisi App"
requires-python = ">=3.10"
dependencies = [
    "pika",
    "psycopg2-binary",
    "prometheus-client"
]

[tool.setuptools]
packages = ["event_lib"]
