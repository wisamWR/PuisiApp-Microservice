
name: puisiapp-k7

services:
  rabbitmq:
    build:
      context: ./rabbitmq
    image: rasa/rabbitmq:4.1.8-dmx4.1.0
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - k7-rabbitmq-data:/var/lib/rabbitmq
    networks: [app, data]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  rabbitmq-topologi:
    build:
      context: ..
      dockerfile: libs/node/Dockerfile
    image: puisiapp-k7/node-tools:dev
    restart: "no"
    environment:
      SERVICE_NAME: rabbitmq-topologi
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [data]
    depends_on:
      rabbitmq:
        condition: service_healthy

  fingerprint-worker:
    build:
      context: ..
      dockerfile: services/fingerprint-worker/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: fingerprint-worker
      HOST: 0.0.0.0
      PORT: "8080"
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/${RABBITMQ_VHOST}
      MINHASH_SEED: "42"
      MINHASH_NUM_HASHES: "128"
      SHINGLE_SIZE: "3"
    networks: [app, data]
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-topologi:
        condition: service_completed_successfully

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=20
      - -c
      - max_replication_slots=20
      - -c
      - max_slot_wal_keep_size=1024MB
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - k7-pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  similarity-worker:
    build:
      context: ..
      dockerfile: services/similarity-worker/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: similarity-worker
      HOST: 0.0.0.0
      PORT: "8080"
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/${RABBITMQ_VHOST}
      DATABASE_URL: postgresql://similarity:${SIMILARITY_DB_PASS}@postgres:5432/similarity_db
      MINHASH_NUM_HASHES: "128"
      LSH_BANDS: "32"
      LSH_ROWS: "4"
      THRESHOLD_INSPIRED: "0.20"
      THRESHOLD_SIMILAR: "0.50"
      THRESHOLD_PLAGIARISM: "0.80"
    networks: [app, data]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  outbox-relay-similarity:
    extends:
      file: debezium/relay.yml
      service: outbox-relay
    environment:
      RELAY_DB: similarity_db
      RELAY_SLOT: outbox_similarity
    volumes:
      - k7-relay-similarity-data:/debezium/data
    depends_on:
      rabbitmq-topologi:
        condition: service_completed_successfully
      similarity-worker:
        condition: service_healthy

networks:
  app: {}
  data: {}

volumes:
  k7-rabbitmq-data: {}
  k7-pg-data: {}
  k7-relay-similarity-data: {}