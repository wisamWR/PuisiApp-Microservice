[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puisiapp-similarity-worker"
version = "0.1.0"
description = "Worker untuk mendeteksi kemiripan puisi menggunakan MinHash dan LSH"
requires-python = ">=3.11"
dependencies = [
    "pika==1.3.2",
    "psycopg2-binary==2.9.9",
    "jsonschema==4.23.0",
    "prometheus-client==0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
