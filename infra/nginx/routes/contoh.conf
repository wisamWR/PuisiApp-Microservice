# Layanan contoh (T0.2/T0.9): hanya untuk memeriksa deploy dari browser.
#   GET /api/contoh/health -> example-consumer /health
# Bila CONTOH_HOST tidak diisi, rute ini dijawab 404 sehingga aman di deploy lengkap.
location = /api/contoh/health {
    limit_except GET HEAD { deny all; }
    if ($up_contoh = "") {
        return 404;
    }
    proxy_pass http://$up_contoh/health;
    include /etc/nginx/common/proxy-headers.conf;
}
