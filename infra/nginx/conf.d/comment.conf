# Rute komentar (kelompok 4 Community).
# Rate limit hanya untuk kirim komentar: 10 per menit per pengguna (kunci = cookie token).
# Request lain mendapat kunci kosong, sehingga tidak dihitung di zona ini.
map "$request_method:$uri" $comment_limit_key {
    default "";
    "~^POST:/api/poems/[^/]+/comments$" $cookie_access_token;
}

limit_req_zone $comment_limit_key zone=comment_user:10m rate=10r/m;
