[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puisiapp-theme-worker"
version = "0.1.0"
description = "Worker ekstraksi tema puisi berbasis kamus YAML (K6)"
requires-python = ">=3.11"
dependencies = [
    "pymongo==4.8.0",
    "PyYAML>=6.0",
    "puisi-event-lib @ file:../../libs/python"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
