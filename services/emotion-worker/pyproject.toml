[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puisiapp-emotion-worker"
version = "0.1.0"
description = "Worker analisis emosi puisi berbasis leksikon (K5)"
requires-python = ">=3.11"
dependencies = [
    "pymongo==4.8.0",
    "puisi-event-lib @ file:../../libs/python",
    "prometheus-client==0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
