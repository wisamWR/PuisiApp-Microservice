# Compose deploy minimal (T0.9 latihan deploy; dasar untuk T10.4).
#
# Berbeda dari compose lokal:
#   - layanan memakai image dari GHCR (tidak ada build di EC2);
#   - tanpa MinIO, Mailpit, dan override port 127.0.0.1;
#   - hanya api-gateway yang membuka port ke publik.
#
# Isi minimal sesuai T0.9: gateway, satu layanan contoh (example-consumer),
# RabbitMQ, dan PostgreSQL. Layanan lain ditambahkan di T10.4.
#
# Dijalankan dari root repositori dengan .env berisi
#   COMPOSE_FILE=infra/docker-compose.prod.yml
# (lihat docs/runbook.md). Repositori tetap di-clone karena skrip init
# PostgreSQL dibaca dari infra/postgres/init.
#
# Tag image: IMAGE_TAG=main (terbaru) atau sha-<commit> untuk rollback.

name: puisiapp

services:
  api-gateway:
    image: ${REGISTRY:-ghcr.io/wisamwr}/puisiapp-api-gateway:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    ports:
      # Satu-satunya port publik. Security group EC2 hanya membuka 80 (dan 22 untuk tim).
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_HOST_PORT:-80}:80"
    networks: [edge, app]

  rabbitmq:
    image: ${REGISTRY:-ghcr.io/wisamwr}/puisiapp-rabbitmq:${IMAGE_TAG:-main}
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?isi RABBITMQ_USER di .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?isi RABBITMQ_PASS di .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-rasa}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [app, data]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  # Exchange domain dan binding dari contracts/routing.json (sekali jalan).
  rabbitmq-topologi:
    image: ${REGISTRY:-ghcr.io/wisamwr}/puisiapp-node-tools:${IMAGE_TAG:-main}
    restart: "no"
    environment:
      SERVICE_NAME: rabbitmq-topologi
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [data]
    depends_on:
      rabbitmq: { condition: service_healthy }

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=20
      - -c
      - max_replication_slots=20
      - -c
      - max_slot_wal_keep_size=1024MB
    env_file:
      - path: ../.env
        required: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?isi POSTGRES_USER di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Layanan contoh (T0.2): /health lewat gateway dan alur event terbit -> terkonsumsi.
  example-consumer:
    image: ${REGISTRY:-ghcr.io/wisamwr}/puisiapp-example-consumer:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      SERVICE_NAME: example-consumer
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://example:${EXAMPLE_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/example_db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  edge: {}
  app:
    internal: true
  data:
    internal: true

volumes:
  rabbitmq-data: {}
  pg-data: {}
