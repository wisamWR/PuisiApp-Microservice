# Rute domain Penulisan puisi (kelompok 2).
# Semua konten puisi butuh login (laporan Tabel 3.1).
# X-User-Id dan X-User-Role diatur common/proxy-headers.conf dari auth_request; jangan set ulang.

# POST -> poem-create (ajukan puisi, 202). GET -> poem-query (daftar puisi, T2.3).
location = /api/poems {
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    limit_except GET HEAD POST { deny all; }
    # Puisi adalah teks pendek: isi maksimal 8.000 karakter (laporan 11.4).
    client_max_body_size 64k;
    proxy_pass http://$up_poems_koleksi$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
    # Diteruskan ke layanan: traceparent untuk tracing, Idempotency-Key ikut otomatis.
    proxy_set_header traceparent $http_traceparent;
}

# Pratinjau gambar kutipan (T2.5): publik seperti Listing A.6 laporan. Hasil
# hanya bergantung pada query string, sehingga di-cache CloudFront 24 jam
# (Cache-Control dari layanan) dan browser memakai ETag/304.
location = /api/images/preview {
    limit_except GET HEAD { deny all; }
    limit_req zone=pratinjau_ip burst=20 nodelay;
    proxy_pass http://$up_image_preview$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

location = /api/images/templates {
    limit_except GET HEAD { deny all; }
    proxy_pass http://$up_image_preview$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}
