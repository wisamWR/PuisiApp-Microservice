# GET dan POST daftar komentar pada puisi.
location ~ ^/api/poems/[^/]+/comments$ {
    limit_except GET HEAD POST {
        deny all;
    }

    limit_req zone=comment_user burst=9 nodelay;
    auth_request /_auth;
    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;

    proxy_pass http://$up_comment$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

# POST laporan komentar untuk moderator.
location ~ ^/api/comments/[^/]+/report$ {
    limit_except POST {
        deny all;
    }

    auth_request /_auth;
    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;

    proxy_pass http://$up_comment$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

# DELETE komentar.
location ~ ^/api/comments/[^/]+$ {
    limit_except DELETE {
        deny all;
    }

    auth_request /_auth;
    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;

    proxy_pass http://$up_comment$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}
