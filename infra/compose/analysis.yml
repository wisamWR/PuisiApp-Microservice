
# Domain analysis
# Kelompok: 5 Mood, 6 Tema (Sabila); 7 Keaslian (Raffa)

services:
  emotion-worker:
    build:
      context: ..
      dockerfile: services/emotion-worker/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: emotion-worker
      PORT: "8080"
      PREFETCH: "10"
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@${MONGO_HOST}:${MONGO_PORT}/?authSource=admin
      MONGO_DB: emotion-db
    networks: [app, data]
    depends_on:
      mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }

  mood-feed:
    build:
      context: ..
      dockerfile: services/mood-feed-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: mood-feed
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL_SECONDS: "60"
      DATABASE_URL: postgres://mood_feed:${MOOD_FEED_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/mood_feed_db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }

  # T7.1 - Fingerprint Worker
  fingerprint-worker:
    build:
      context: ..
      dockerfile: services/fingerprint-worker/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: fingerprint-worker
      HOST: 0.0.0.0
      PORT: "8080"
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/${RABBITMQ_VHOST}
      MINHASH_SEED: "42"
      MINHASH_NUM_HASHES: "128"
      SHINGLE_SIZE: "3"
    networks: [app, data]
    depends_on:
      rabbitmq: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }

  # T7.2 - Similarity Worker
  similarity-worker:
    build:
      context: ..
      dockerfile: services/similarity-worker/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: similarity-worker
      HOST: 0.0.0.0
      PORT: "8080"
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/${RABBITMQ_VHOST}
      DATABASE_URL: postgresql://similarity:${SIMILARITY_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/similarity_db
      MINHASH_NUM_HASHES: "128"
      LSH_BANDS: "32"
      LSH_ROWS: "4"
      THRESHOLD_INSPIRED: "0.20"
      THRESHOLD_SIMILAR: "0.50"
      THRESHOLD_PLAGIARISM: "0.80"
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }

  outbox-relay-similarity:
    extends:
      file: debezium/relay.yml
      service: outbox-relay
    environment:
      RELAY_DB: similarity_db
      RELAY_SLOT: outbox_similarity
    volumes:
      - relay-similarity-data:/debezium/data
    depends_on:
      rabbitmq-topologi: { condition: service_completed_successfully }
      similarity-worker: { condition: service_healthy }

volumes:
  relay-similarity-data: {}
