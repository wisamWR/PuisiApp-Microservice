# nginx.conf induk: hanya pengaturan umum. Rute per domain ada di routes/ dan conf.d/.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_gw escape=json
        '{"ts":"$time_iso8601","rid":"$request_id","method":"$request_method",'
        '"uri":"$uri","status":$status,"upstream":"$upstream_addr",'
        '"rt":$request_time}';
    access_log  /var/log/nginx/access.log  json_gw;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size  1m;

    # Login belum punya cookie, jadi dibatasi per IP: 10 percobaan per menit.
    limit_req_zone  $binary_remote_addr  zone=login_ip:10m  rate=10r/m;
    # Pembatasan per pengguna memakai cookie token (kosong = tidak dibatasi di zona ini).
    limit_req_zone  $cookie_access_token  zone=auth_user:10m  rate=30r/m;
    limit_req_status  429;

    # Cache hasil verifikasi token: 30 detik (sesuai syarat pencabutan token <= 30 detik).
    proxy_cache_path  /var/cache/nginx/auth  levels=1:2  keys_zone=auth_cache:1m
                      max_size=10m  inactive=60s  use_temp_path=off;
    # Micro-cache feed: 3 detik. Dipakai oleh rute feed milik kelompok lain.
    proxy_cache_path  /var/cache/nginx/feed  levels=1:2  keys_zone=feed_cache:10m
                      max_size=100m  inactive=10s  use_temp_path=off;

    # DNS embedded Docker: alamat layanan di-resolve saat request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
