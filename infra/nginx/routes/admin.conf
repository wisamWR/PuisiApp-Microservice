# Admin: ubah peran pengguna (T1.7). Cek peran admin ditangani token-service lewat /_auth_admin:
# 401 tanpa token, 403 bukan admin, lolos untuk admin. Pemeriksaan di auth_request, bukan di if
# (if berjalan sebelum auth_request, sehingga peran belum terisi).
location ~ ^/api/admin/users/[^/]+/role$ {
    limit_except PUT { deny all; }
    auth_request /_auth_admin;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    proxy_pass http://$up_register$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

# Cari pengguna untuk admin (T1.7): GET /api/admin/users?q=...
location = /api/admin/users {
    limit_except GET { deny all; }
    auth_request /_auth_admin;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    error_page 401 = @unauthorized;
    proxy_pass http://$up_register$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

