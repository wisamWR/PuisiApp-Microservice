global
    log stdout format raw local0
    maxconn 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  redispatch
    retries 2
    timeout connect 2s
    timeout client  30s
    timeout server  10s

frontend http_in
    bind *:80
    default_backend gateways

backend gateways
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    retry-on all-retryable-errors
    default-server inter 3s fall 3 rise 2
    server gw1 gateway-1:80 check
    server gw2 gateway-2:80 check
