# Domain identity
# Kelompok: 1 Akun dan identitas (Azka)
# Layanan: register, login, token, profile, account-recovery, email-worker
#
# Tulis layanan domain ini di sini. Path relatif dihitung dari folder infra/
# (project_directory pada include), jadi build context ditulis ../services/<nama>.
# Pola lengkap ada di infra/README.md. Alamat dependensi diambil dari .env.

services:
  # register-service (T1.1): POST /api/auth/register lalu event user.registered lewat outbox.
  register-service:
    build:
      context: ..
      dockerfile: services/register-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: register-service
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://register:${REGISTER_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/account_db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # login-service (T1.2): konsumsi user.registered, POST /api/auth/login.
  login-service:
    build:
      context: ..
      dockerfile: services/login-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: login-service
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://login_svc:${LOGIN_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/credential_db
      TOKEN_SERVICE_URL: http://token-service:8080
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }
      token-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # token-service (T1.2): JWT RS256 dan rotasi refresh token di Redis.
  # Dijalankan minimal 2 replika: docker compose up -d --scale token-service=2
  token-service:
    build:
      context: ..
      dockerfile: services/token-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: token-service
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks: [app, data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Relay outbox account_db (T0.3). Dibuat dari templat yang sama dengan relay lain.
  outbox-relay-account:
    extends:
      file: debezium/relay.yml
      service: outbox-relay
    environment:
      RELAY_DB: account_db
      RELAY_SLOT: outbox_account
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
      - relay-account-data:/debezium/data
    depends_on:
      rabbitmq-topologi: { condition: service_completed_successfully }
      register-service: { condition: service_healthy }   # yang membuat tabel outbox

volumes:
  relay-account-data: {}
