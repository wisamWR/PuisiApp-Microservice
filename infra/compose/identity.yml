# Domain identity
# Kelompok: 1 Akun dan identitas (Azka)
# Layanan: register, login, token, profile, account-recovery, email-worker
#
# Tulis layanan domain ini di sini. Path relatif dihitung dari folder infra/
# (project_directory pada include), jadi build context ditulis ../services/<nama>.
# Pola lengkap ada di infra/README.md. Alamat dependensi diambil dari .env.

services:
  # register-service (T1.1): POST /api/auth/register lalu event user.registered lewat outbox.
  register-service:
    build:
      context: ..
      dockerfile: services/register-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: register-service
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://register:${REGISTER_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/account_db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # login-service (T1.2): konsumsi user.registered, POST /api/auth/login.
  login-service:
    build:
      context: ..
      dockerfile: services/login-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: login-service
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://login_svc:${LOGIN_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/credential_db
      TOKEN_SERVICE_URL: http://token-service:8080
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }
      token-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # token-service (T1.2): JWT RS256 dan rotasi refresh token di Redis.
  # Dijalankan minimal 2 replika: docker compose up -d --scale token-service=2
  token-service:
    build:
      context: ..
      dockerfile: services/token-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: token-service
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks: [app, data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # account-recovery-service (T1.6): verifikasi email, forgot/reset password, cabut refresh token.
  account-recovery-service:
    build:
      context: ..
      dockerfile: services/account-recovery-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: account-recovery-service
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${RECOVERY_DB_USER:-recovery}:${RECOVERY_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/${RECOVERY_DB_NAME:-recovery_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # email-worker (T1.6): konsumsi email.send.requested dan kirim email via SMTP/Mailpit.
  email-worker:
    build:
      context: ..
      dockerfile: services/email-worker/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: email-worker
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-PuisiApp <no-reply@puisiapp.local>}
      DATABASE_URL: postgres://${EMAIL_WORKER_DB_USER:-email_worker}:${EMAIL_WORKER_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EMAIL_WORKER_DB_NAME:-email_worker_db}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Mailpit (SMTP lokal untuk T1.6) didefinisikan di infra/docker-compose.yml;
  # port UI/SMTP ke host hanya dibuka di docker-compose.dev.yml.

  # Relay outbox account_db (T0.3). Dibuat dari templat yang sama dengan relay lain.
  outbox-relay-account:
    extends:
      file: debezium/relay.yml
      service: outbox-relay
    environment:
      RELAY_DB: account_db
      RELAY_SLOT: outbox_account
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
      - relay-account-data:/debezium/data
    depends_on:
      rabbitmq-topologi: { condition: service_completed_successfully }
      register-service: { condition: service_healthy }   # yang membuat tabel outbox

  # Relay outbox recovery_db untuk event email.send.requested.
  outbox-relay-recovery:
    extends:
      file: debezium/relay.yml
      service: outbox-relay
    environment:
      RELAY_DB: recovery_db
      RELAY_SLOT: outbox_recovery
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
      - relay-recovery-data:/debezium/data
    depends_on:
      rabbitmq-topologi: { condition: service_completed_successfully }
      account-recovery-service: { condition: service_healthy }

  # profile-service (T1.5): profil publik. Konsumsi user.registered, ubah profil lewat /api/profiles/me.
  profile-service:
    build:
      context: ..
      dockerfile: services/profile-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: profile-service
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://profile_svc:${PROFILE_DB_PASS}@${POSTGRES_HOST}:${POSTGRES_PORT}/profile_db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rabbitmq-topologi: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Relay outbox profile_db (T0.3): user.profile.updated ke RabbitMQ.
  outbox-relay-profile:
    extends:
      file: debezium/relay.yml
      service: outbox-relay
    environment:
      RELAY_DB: profile_db
      RELAY_SLOT: outbox_profile
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
      - relay-profile-data:/debezium/data
    depends_on:
      rabbitmq-topologi: { condition: service_completed_successfully }
      profile-service: { condition: service_healthy }   # yang membuat tabel outbox

volumes:
  relay-account-data: {}
  relay-profile-data: {}
  relay-recovery-data: {}
