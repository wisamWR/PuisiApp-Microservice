openapi: 3.0.3
info:
  title: Theme Feed Service API
  version: 1.0.0
  description: Endpoint feed puisi berdasarkan tema (Kelompok 6)
paths:
  /api/themes/summary:
    get:
      summary: Ringkasan jumlah puisi per tema
      responses:
        "200":
          description: Ringkasan tema
  /api/feed/theme/{tema}:
    get:
      summary: Ambil feed puisi berdasarkan tema
      parameters:
        - name: tema
          in: path
          required: true
          schema:
            type: string
            enum: [rindu, kesepian, alam, perjuangan, keluarga, religius, lainnya]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Daftar puisi terpaginasi untuk tema terpilih
        "400":
          description: Tema tidak valid
