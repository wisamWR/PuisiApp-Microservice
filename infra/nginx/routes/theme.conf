location ~ ^/api/feed/theme/[^/]+$ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://$up_theme_feed$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}

location = /api/themes/summary {
    limit_except GET HEAD { deny all; }
    proxy_pass http://$up_theme_feed$request_uri;
    include /etc/nginx/common/proxy-headers.conf;
}
