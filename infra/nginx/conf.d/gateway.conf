# Server utama. Satu-satunya server yang dipetakan ke host.
server {
    listen 80;
    server_name _;

    include /etc/nginx/vars.conf;

    # Identitas default kosong. Hanya auth_request_set di rute terlindungi yang mengisinya,
    # sehingga header X-User-Id dan X-User-Role dari klien tidak pernah sampai ke layanan.
    set $user_id   "";
    set $user_role "";

    # Dipanggil dari auth_request. Tidak bisa diakses dari luar.
    location = /_auth {
        internal;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 1s;
        proxy_read_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://$up_auth/internal/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Request-Id $request_id;
        proxy_cache auth_cache;
        proxy_cache_key $cookie_access_token;
        proxy_cache_valid 200 30s;
    }

    # Cek admin (T1.7): dipakai auth_request dari rute admin. Tidak bisa diakses dari luar.
    location = /_auth_admin {
        internal;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 1s;
        proxy_read_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://$up_auth/internal/auth/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /stub_status {
        stub_status;
        access_log off;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized"}';
    }

    location @auth_unavailable {
        default_type application/json;
        add_header Retry-After "5" always;
        return 503 '{"error":"layanan autentikasi sedang tidak tersedia","alasan":"upstream_unavailable"}';
    }

    # Rute per domain: identity, lalu domain lain ditambahkan kelompok masing-masing.
    include /etc/nginx/routes/*.conf;

    location / {
        proxy_pass http://$up_frontend$request_uri;
        include /etc/nginx/common/proxy-headers.conf;
    }
}
