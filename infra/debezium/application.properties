# Templat Debezium Server untuk outbox-relay (T0.3).
#
# Satu container relay per database ber-outbox; semua memakai berkas ini dan
# hanya berbeda di variabel RELAY_DB dan RELAY_SLOT (lihat infra/debezium/relay.yml).
# ${VAR} dibaca dari variabel lingkungan container.
#
# Alur: tabel outbox -> WAL (pgoutput, publication outbox_pub) -> Outbox
# Event Router -> exchange outbox.relay (routing key = event_type) ->
# exchange-to-exchange binding dari contracts/routing.json -> exchange domain.

# ---------------------------------------------------------------- sink RabbitMQ
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=${RABBITMQ_HOST}
debezium.sink.rabbitmq.connection.port=${RABBITMQ_PORT:5672}
debezium.sink.rabbitmq.connection.username=${RABBITMQ_USER}
debezium.sink.rabbitmq.connection.password=${RABBITMQ_PASS}
debezium.sink.rabbitmq.connection.virtual.host=${RABBITMQ_VHOST}
# Debezium Server hanya bisa menerbitkan ke satu exchange.
debezium.sink.rabbitmq.exchange=outbox.relay
# Routing key = record key = kolom event_type (lihat table.field.event.key).
debezium.sink.rabbitmq.routingKey.source=key
# Persistent + publisher confirm: relay baru melangkah setelah broker menyimpan pesan.
debezium.sink.rabbitmq.deliveryMode=2
debezium.sink.rabbitmq.ackTimeout=30000

# ---------------------------------------------------------------- sumber PostgreSQL
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=${POSTGRES_HOST}
debezium.source.database.port=${POSTGRES_PORT:5432}
debezium.source.database.user=debezium
debezium.source.database.password=${DEBEZIUM_DB_PASS}
debezium.source.database.dbname=${RELAY_DB}
debezium.source.topic.prefix=${RELAY_DB}
debezium.source.plugin.name=pgoutput
# Slot dibuat skrip init database (infra/postgres/init), publication dibuat
# migrasi outbox layanan. Relay tidak membuat keduanya.
debezium.source.slot.name=${RELAY_SLOT}
debezium.source.publication.name=outbox_pub
debezium.source.publication.autocreate.mode=disabled
debezium.source.table.include.list=public.outbox
# Tidak ada snapshot: semua baris sejak slot dibuat datang dari WAL, sehingga
# kehilangan berkas offset tidak membuat seluruh outbox lama diterbitkan ulang.
debezium.source.snapshot.mode=no_data
debezium.source.tombstones.on.delete=false
# Posisi baca disimpan di volume; restart melanjutkan dari posisi terakhir.
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# ---------------------------------------------------------------- Outbox Event Router
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.id=event_id
debezium.transforms.outbox.table.field.event.key=event_type
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.route.by.field=aggregate_type
# payload JSONB dikirim sebagai objek JSON (amplop utuh), bukan string.
debezium.transforms.outbox.table.expand.json.payload=true
debezium.transforms.outbox.table.op.invalid.behavior=warn

# ---------------------------------------------------------------- format pesan
debezium.format.key=simplestring
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.header=json

# ---------------------------------------------------------------- server
quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.console.json=false
