# Domain puisi (kelompok 2): bagian yang harus berada di konteks http.
# Satu path /api/poems dilayani dua layanan menurut metode HTTP (CQRS):
#   POST -> poem-create-service (T2.1), selain itu -> poem-query-service (T2.3).
# Nilai map adalah variabel dari templates/vars.conf.template, dievaluasi saat request.
map $request_method $up_poems_koleksi {
    POST    $up_poem_create;
    default $up_poem_query;
}

# Pratinjau gambar dipanggil berulang saat penulis mengetik (debounce 500 ms
# di frontend). Render memakai CPU, jadi dibatasi per IP.
limit_req_zone  $binary_remote_addr  zone=pratinjau_ip:10m  rate=10r/s;
